[project]
name = "ebay-orders"
version = "0"
description = "Локальная система: скриншоты eBay Order details → распознавание → чистовые заказы."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "openai>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    # фото товаров: ссылки галереи eBay + заливка в MinIO (item-лейн, без браузера).
    # Пин на коммит — контракт жёсткий, bump осознанный (как в parser_ebay).
    "ebay-library @ git+https://github.com/Stepan2222000/ebay-library.git@a39a8e9",
    # конвертация ручных фото в JPEG (вход вкл. HEIC с телефона)
    "Pillow>=10",
    "pillow-heif>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ebay-library ставится прямой git-ссылкой (см. dependencies) — hatchling требует
# явного разрешения direct references, иначе metadata-generation падает.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
