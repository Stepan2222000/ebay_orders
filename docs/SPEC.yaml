# ══════════════════════════════════════════════════════════
# Как читать этот документ
#
# YAML описывает логику системы на трёх уровнях:
#
# 1. purpose — общее описание: что система делает, для кого,
#    ключевые принципы. Читай первым.
#
# 2. definitions — справочные карточки технических сущностей.
#    [[id]] в любом тексте = ссылка на definition с таким id.
#    ![[id#секция]] = встроить нужную секцию прямо в узел.
#    Здесь описано КАК устроены инструменты, файлы, правила и поля.
#
# 3. steps → links — плоский граф выполнения. Шаги идут общим
#    списком, стрелки (links) показывают переходы и ветвления.
#    Здесь описано ЧТО происходит в системе.
#
# Для реализации: шаги говорят что делать, definitions —
# как именно. Если текст уже есть в definition, шаг ссылается
# на него, а не дублирует руками.
# ══════════════════════════════════════════════════════════

purpose: |
  `ebay_orders` — локальная система для одного пользователя, которая принимает
  скриншоты страницы eBay Order details, распознаёт видимый текст, объединяет
  скриншоты одного заказа и сохраняет чистовые данные заказа.

  Сейчас поддерживается только одна страница: [[поддерживаемая страница заказа]].
  Другие страницы eBay, страницы отслеживания, страницы товара, страницы продавца
  и отдельные внешние базы данных в этом маршруте не описываются.

  Главный принцип: система не угадывает. Если данные нельзя строго понять,
  нельзя связать скриншоты в один заказ, видна сумма в другой валюте без
  долларового эквивалента или найдено противоречие, чистовая запись не создаётся
  и пользователь получает понятную ошибку.

  Разделение ролей:
  - [[Стадия A распознавание одного снимка]] — смотрит на один скриншот и
    записывает сырой результат.
  - [[Стадия B сборка заказа]] — читает сырой результат, группирует снимки,
    проверяет правила и пишет чистовые данные.

  Помимо основного маршрута заказов агент стадии B видит и обычные
  фото, прикреплённые пользователем прямо в чат — отвечает по ним
  текстом, в чистовой слой не сохраняет (см.
  [[Стадия B сборка заказа#контракт]]).

definitions:
  - id: поддерживаемая страница заказа
    body_markdown: |
      Поддерживается только страница eBay Order details на английском
      языке. Локализованные версии (немецкий, испанский и т.д.) не
      поддерживаются — модель честно вернёт `is_order_details=false`,
      и заказ создан не будет.

      <!-- ^признаки -->
      Снимок считается поддержанным, если видны признаки страницы заказа:
      - номер заказа eBay, если попал в кадр;
      - блок с `Order details` или близким текстом;
      - `Sold by`;
      - итог заказа;
      - строки товаров, доставки, статуса или отслеживания.

      <!-- ^неподдержанные-страницы -->
      Не поддерживаются:
      - страница отслеживания;
      - страница товара;
      - страница продавца;
      - список заказов;
      - страница оплаты вне Order details;
      - любой скриншот, по которому нельзя уверенно понять, что это часть Order details.

      <!-- ^ошибка -->
      Неподдержанная страница не превращается в чистовые данные. Система пишет
      ошибку пользователю и помечает обработку этой группы как неуспешную.

  - id: базовые правила
    body_markdown: |
      <!-- ^без-угадывания -->
      Если значения не видно или его нельзя связать с заказом, система не
      придумывает значение и не берёт запасной вариант.

      <!-- ^пустое-не-затирает -->
      Новое пустое значение не стирает уже сохранённое непустое значение.
      Отсутствие поля на одном скриншоте нормально, если оно есть на другом
      скриншоте той же группы или уже есть в базе без конфликта.

      <!-- ^строгие-противоречия -->
      Два разных непустых значения одного и того же поля — ошибка, если это
      нельзя объяснить разными строками товаров или разными номерами отслеживания.

      <!-- ^тихий-чат -->
      В чат не выводятся внутренние рассуждения и каждое найденное поле.
      Пользователь видит итог, прямой ответ или ошибку с причиной.

  - id: Стадия A распознавание одного снимка
    body_markdown: |
      Стадия A — это "глаза" системы. Каждый вызов смотрит на один
      скриншот и пишет, что на нём видно, без всяких выводов и
      сохранений.

      <!-- ^контракт -->
      Один вызов — один файл картинки. Стадия A:
      - транскрибирует видимый текст;
      - отмечает, похож ли снимок на [[поддерживаемая страница заказа]];
      - возвращает сырой JSON по [[формат сырого распознавания]];
      - не читает историю чата;
      - не читает базу;
      - не группирует скриншоты;
      - не решает, что сохранять в чистовую запись.

      <!-- ^ошибка -->
      Если модель не вернула валидный JSON, снимок помечается как
      «ошибка распознавания» и стадия A на этом останавливается. Второго
      автоматического вызова другой моделью нет.

      <!-- ^технически -->
      Используется vision-модель через OpenRouter, по умолчанию
      `moonshotai/kimi-k2.6`
      (https://openrouter.ai/moonshotai/kimi-k2.6). Картинка отправляется
      как multimodal-парт сообщения
      (https://openrouter.ai/docs/guides/overview/multimodal/image-understanding),
      формат ответа жёстко зафиксирован JSON-схемой с `strict: true`
      (https://openrouter.ai/docs/guides/features/structured-outputs).
      Если конкретный провайдер у OpenRouter ведёт себя плохо
      (например, зацикливается на длинных страницах), его можно
      исключить через параметр `provider`
      (https://openrouter.ai/docs/features/provider-routing).

  - id: Стадия B сборка заказа
    body_markdown: |
      Стадия B — это "мозг и руки" системы. Это агент, который
      разговаривает с пользователем в чате. Он же принимает результаты
      стадии A, собирает заказы, отвечает на вопросы и применяет правки.

      <!-- ^контракт -->
      Агент видит:
      - историю переписки;
      - число распознанных снимков, ещё не привязанных к заказу
        (это число попадает в системный промпт; подробности по каждому
        снимку — sha и observed — агент при необходимости поднимает сам
        через [[инструмент SQL]]);
      - заказы и их связки в базе ([[чистовые таблицы]]);
      - фото, прикреплённые пользователем прямо в чат-сообщение, —
        смотрит на них как обычный мультимодальный собеседник, отвечает
        текстом, в чистовой слой не сохраняет.

      Что агент делает:
      - объединяет снимки одного заказа по [[правила группировки снимков]];
      - собирает [[чистые поля заказа]] и проверяет [[правила денег USD]],
        [[правила достаточности данных]], [[правила конфликта с базой]];
      - пишет данные через [[инструмент сохранения заказа]];
      - правит и удаляет заказы по просьбе пользователя через
        [[инструмент SQL]];
      - сообщает пользователю только итог или ошибку.

      <!-- ^запуск -->
      Агент запускается только на сообщение пользователя в чате. Без
      сообщения он не работает: воркер стадии A может сколь угодно долго
      накапливать pending-снимки — стадия B сама их не трогает, ничего
      в чистовой слой не пишет, в чат не пишет. Пользователь — единственный
      инициатор записей.

      <!-- ^технически -->
      Стадия B — отдельная LLM-сессия со своей моделью из конфигурации
      (модель отличается от vision-модели стадии A). Через OpenRouter в
      режиме tool-calling
      (https://openrouter.ai/docs/guides/features/tool-calling). У агента
      два инструмента: [[инструмент сохранения заказа]] и
      [[инструмент SQL]]. Сессия живёт ровно столько, сколько идёт
      ответ агента пользователю — пока тянется стрим, агент жив; стрим
      закончился или оборвался — сессии больше нет. Подробности о том,
      как именно ответ передаётся в браузер, — в [[стрим стадии B]].

      <!-- ^persistence -->
      Сообщение пользователя сохраняется в историю
      ([[технические таблицы#chat]]) сразу, в начале обработки запроса.
      Сообщение ассистента сохраняется один раз — по завершении ответа.
      Если ответ дошёл до конца, в истории появляется полное сообщение
      со всеми его частями (текст и блоки действий). Если ответ был
      прерван, сохраняется то, что успело прозвучать, и в конце
      добавляется пометка «прервано». Промежуточные обновления
      assistant-сообщения по ходу стрима в базу не пишутся.

      Для справки по самому паттерну см.
      https://ai-sdk.dev/docs/ai-sdk-ui/chatbot-message-persistence

      <!-- ^параллель-tool-вызовов -->
      В одном шаге своего ответа модель может попросить выполнить
      несколько действий сразу (например, сохранить десяток заказов).
      Они исполняются параллельно — см. [[параллельность tool-вызовов]].

  - id: формат сырого распознавания
    body_markdown: |
      Сырой результат хранит то, что видно на конкретном скриншоте.

      <!-- ^поля -->
      Минимальная форма:

      ```yaml
      sha256: строка
      is_order_details: true | false | null
      visible_text: строка
      observed:
        order_number: строка | null
        ordered_at: строка | null
        sold_by: строка | null
        order_total_text: строка | null
        item_subtotal_text: строка | null
        shipping_text: строка | null
        sales_tax_text: строка | null
        delivery_status: строка | null
        delivered_date: строка | null
        arriving_by_date: строка | null
        shipping_service: строка | null
        tracking_numbers: список строк
        items: список видимых товаров
        refunds: список видимых возвратов
      unreadable: список фрагментов, которые модель видит, но не может прочитать
      ```

      <!-- ^деньги -->
      Денежные значения в сыром слое сохраняются как текст с тем знаком, который
      был виден на странице. В чистовой слой они попадают только после проверки
      [[правила денег USD]].

      <!-- ^граница -->
      Сырой слой не является бизнес-решением. Он нужен для аудита, повторной
      проверки и объяснения ошибок.

  - id: чистые поля заказа
    body_markdown: |
      Оглавление чистовых полей страницы Order details.

      <!-- ^состав -->
      Сохраняемые группы:
      - [[поля идентификации заказа]]
      - [[денежные поля заказа]]
      - [[поля доставки заказа]]
      - [[поля товара]]
      - [[поля возврата]]

      Поля, которых нет в этих definitions, не пишутся в чистовой слой.

  - id: поля идентификации заказа
    body_markdown: |
      Поля, по которым заказ узнаётся и связывается с продавцом.

      <!-- ^поля -->
      - `order_number` — номер заказа eBay.
      - `sold_by` — имя продавца из строки `Sold by`. Адрес продавца не хранится.
      - `ordered_at` — дата и время оформления заказа, если видны.

  - id: денежные поля заказа
    body_markdown: |
      Денежные поля заказа. Все суммы в чистовом слое хранятся в USD.

      <!-- ^поля -->
      - `order_total_usd` — итог заказа в долларах США.
      - `item_subtotal_usd` — сумма товаров до доставки, налога и возврата, если видна.
      - `shipping_usd` — стоимость доставки, если видна. `Free` сохраняется как `0.00`.
      - `sales_tax_usd` — налог, если виден.

      Валюта отдельным полем не хранится: чистовой слой всегда в USD.

  - id: поля доставки заказа
    body_markdown: |
      Поля доставки из страницы Order details.

      <!-- ^поля -->
      - `delivery_status` — видимый статус доставки.
      - `delivered_date` — дата доставки, если заказ уже доставлен.
      - `arriving_by_date` — один текстовый диапазон или одна дата ожидаемой доставки.
      - `shipping_service` — полный видимый сервис доставки, например `USPS Ground Advantage`.
      - `tracking_numbers[]` — все видимые номера отслеживания.
      - `is_untracked` — `true` только если страница явно говорит, что отслеживания нет.

      Отдельного `carrier` нет. Если перевозчик входит в название сервиса,
      он остаётся частью `shipping_service`.

  - id: поля товара
    body_markdown: |
      Поля одной строки товара внутри `items[]`.

      <!-- ^поля -->
      - `items[].item_number` — номер товара eBay.
      - `items[].item_title` — название товара.
      - `items[].item_quantity` — количество в строке.
      - `items[].item_line_total_usd` — сумма строки товара в USD.

      `item_line_total_usd` — это сумма строки, а не цена одной штуки. Если
      видно `Quantity 3` и рядом `$135.00`, сохраняется `135.00`, а не расчётная
      цена за одну штуку.

  - id: поля возврата
    body_markdown: |
      Поля одного денежного возврата внутри `refunds[]`.

      <!-- ^поля -->
      - `refunds[].refund_amount_usd` — сколько вернули.
      - `refunds[].refund_date` — дата возврата, если видна.
      - `refunds[].refund_note` — видимый текст причины или статуса, если есть.

      Возвраты необязательны. Если возврат виден, его нужно сохранить.
      Итоговая сумма возвратов считается из `refunds[]`, отдельным дублирующим
      полем не хранится.

  - id: источник изменения
    body_markdown: |
      Любая запись в чистовой слой помечается источником, чтобы
      `order_change_log` (см. [[чистовые таблицы#таблицы]]) можно было читать
      осмысленно.

      <!-- ^значения -->
      - `screenshot` — данные пришли со скриншота через стадию A.
      - `user_chat` — пользователь явно исправил/удалил данные текстом в чате.

      <!-- ^механика -->
      Источник проставляется в начале транзакции и подхватывается
      аудит-триггером, когда тот пишет строку в журнал. Если источник не
      проставлен — журнал всё равно пишется, просто без отметки.

  - id: поля которые не сохраняются
    body_markdown: |
      Эти поля не создаются в чистовой схеме и не должны появляться как
      самостоятельные значения:

      <!-- ^список -->
      - `currency` — нет смысла, чистовой слой всегда USD.
      - `payment_method_brand` — тип карты или платежа.
      - `payment_method_last4` — последние цифры карты.
      - `payment_payer_name` — имя плательщика.
      - `payment_amount_usd` — отдельная сумма оплаты.
      - `payment_at` — время платежа.
      - `paid_date` — отдельная дата оплаты.
      - `tracking_available_date` — дата появления отслеживания.
      - `estimated_delivery_from` и `estimated_delivery_to` — вместо них одно поле `arriving_by_date`.
      - `carrier` — вместо него одно поле `shipping_service`.
      - адрес доставки.
      - адрес продавца.
      - окно возврата товара.
      - статус возврата товара, если это не денежный возврат.
      - `page_type` в чистовых данных.

      <!-- ^payment-info -->
      Блок Payment info не создаёт отдельную сущность оплаты. Если в нём видна
      та же стоимость заказа, она может подтвердить `order_total_usd`, но не
      записывается вторым полем. Если сумма из Payment info противоречит
      другим видимым суммам заказа, это ошибка.

  - id: правила денег USD
    body_markdown: |
      <!-- ^поддерживается -->
      В чистовой слой попадают только суммы в долларах США.

      Поддержанные варианты:
      - `$49.00`;
      - `US $49.00`;
      - другая валюта рядом с уже показанной суммой в USD (прямой эквивалент);
      - `Free` для доставки, как `0.00`;
      - заказ полностью в иностранной валюте, у которого в блоке `Payment info`
        виден USD-эквивалент общего total — см. ^якорь-payment-info.

      <!-- ^якорь-payment-info -->
      Если страница показывает заказ в иностранной валюте (CAD, GBP, EUR и т.п.),
      eBay в блоке `Payment info` рядом с маскированной картой обычно показывает
      одну USD-сумму — это списание с карты, прямой эквивалент общего total.
      Шаблон такой:

      ```
      Ending in <last4> [<имя>] $<usd_total> <foreign_total> <дата>
      ```

      В этом случае:
      - `order_total_usd` берётся из `$<usd_total>` (прямой эквивалент видим на странице);
      - курс выводится из `<usd_total> / <foreign_total>` и применяется к остальным
        видимым компонентам (`item_subtotal_usd`, `shipping_usd`, `sales_tax_usd`,
        `items[].item_line_total_usd`, `refunds[].refund_amount_usd`) с округлением
        до цента;
      - округления eBay дают рассинхрон в пределах `^точность` — это допустимо.

      Если USD-якоря в Payment info нет — обработка группы падает с ошибкой
      (см. ^ошибка-валюты). Курс из внешних источников не берём.

      <!-- ^ошибка-валюты -->
      Если видна другая валюта, код другой валюты или непонятный знак валюты,
      но ни прямой USD-эквивалент рядом, ни USD-якорь в Payment info не видны,
      обработка группы падает с ошибкой.

      Примеры валют, для которых нужен USD-эквивалент или USD-якорь:
      `CAD`, `C$`, `EUR`, `€`, `GBP`, `£`.

      <!-- ^точность -->
      Деньги сравниваются с допуском до 5 центов. Разница больше пяти центов —
      противоречие, если она не объяснена отдельной видимой строкой налога,
      доставки или возврата. Допуск нужен потому, что при пересчёте по
      USD-якорю (см. ^якорь-payment-info) округления eBay дают 1–3 цента
      дрейфа на компонент.

  - id: правила группировки снимков
    body_markdown: |
      Несколько скриншотов могут относиться к одному заказу.

      <!-- ^основа -->
      Группировка строится по совпадающим видимым полям, а не по порядку
      загрузки файлов.

      Сильные признаки:
      - одинаковый `order_number`;
      - одинаковый `sold_by`;
      - одинаковый `order_total_usd`;
      - одинаковый `item_number`;
      - одинаковое название товара;
      - одинаковый `tracking_number`;
      - одинаковый сервис доставки;
      - одинаковые даты заказа, доставки или ожидаемой доставки.

      <!-- ^без-порядка-файлов -->
      Нельзя использовать порядок файлов, имя файла или время выбора файлов как
      единственную причину связать два снимка. Эти данные могут помогать
      диагностике, но не являются правилом группировки.

      <!-- ^без-номера-заказа -->
      Если на одном снимке нет `order_number`, он может войти в группу только
      при строгом совпадении с ровно одной группой по другим сильным признакам.

      <!-- ^неясно -->
      Если снимок подходит к нескольким группам или не подходит ни к одной,
      группа не сохраняется. Пользователь получает ошибку, что скриншот нельзя
      уверенно связать с заказом.

  - id: правила объединения полей
    body_markdown: |
      После группировки стадия B объединяет данные внутри одной группы заказа.

      <!-- ^поведение -->
      - Непустое значение дополняет пустое.
      - Одинаковые значения считаются подтверждением.
      - Разные значения одного поля считаются противоречием.
      - Списки товаров, треков и возвратов объединяются с удалением дублей.
      - Порядок загрузки скриншотов не решает конфликт.

      <!-- ^нормализация -->
      Перед сравнением можно нормализовать пробелы, регистр, разделители дат
      и формат денег. Нормализация не должна менять смысл значения.

  - id: правила достаточности данных
    body_markdown: |
      Чистовая запись создаётся только если после объединения по заказу хватает
      данных.

      <!-- ^минимум-новый-заказ -->
      Минимум для нового заказа:
      - заказ должен иметь номер и продавца из [[поля идентификации заказа]];
      - заказ должен иметь итоговую сумму из [[денежные поля заказа]];
      - заказ должен иметь хотя бы одну строку товара;
      - каждая строка товара должна быть заполнена по [[поля товара]].

      <!-- ^существующий-заказ -->
      Если `order_number` не виден, но снимок строго связан с уже сохранённым
      заказом по [[правила группировки снимков]], можно дописать только новые
      непустые поля. Если строгой связи нет, это ошибка.

      <!-- ^необязательные -->
      Необязательные значения из [[поля идентификации заказа]], [[денежные поля заказа]],
      [[поля доставки заказа]] и [[поля возврата]] сохраняются, когда они видны.

      <!-- ^ошибка -->
      Если после всех скриншотов заказа данных меньше минимума, чистовая запись
      не создаётся. Пользователь получает ошибку с перечислением, чего не
      хватило.

  - id: правила проверки сумм
    body_markdown: |
      Проверка сумм нужна, чтобы не сохранить противоречивую стоимость.
      Постгрес делает её сам — на стороне базы — в момент закрытия
      транзакции, чтобы агент мог сначала записать заказ, а потом его
      строки, не споткнувшись посередине.

      <!-- ^формула -->
      Если видны все компоненты, проверяется:

      ```text
      item_subtotal_usd + shipping_usd + sales_tax_usd = order_total_usd
      ```

      Если налог не виден, он не выдумывается. Если доставка не видна, она не
      выдумывается.

      <!-- ^строки-товаров -->
      Если видна сумма товаров и все строки товаров, проверяется:

      ```text
      sum(items[].item_line_total_usd) = item_subtotal_usd
      ```

      <!-- ^количество-товаров -->
      Если на странице виден общий счётчик товаров, он используется только для
      проверки суммы `items[].item_quantity`. Отдельное поле счётчика не хранится.

      <!-- ^возвраты -->
      Возврат не меняет исходный `order_total_usd`. Видимые возвраты сохраняются
      в `refunds[]`, а итог "сколько вернули" считается отдельно из этих строк.

  - id: правила конфликта с базой
    body_markdown: |
      Сверка с базой делится на три слоя.

      <!-- ^слои -->
      - [[механическая проверка конфликта]] — жёсткие случаи, которые проверяются кодом.
      - [[ИИ проверка совпадения]] — смысловая сверка похожих, обрезанных или
        неидеально распознанных данных.
      - [[финальная проверка перед сохранением]] — последняя механическая
        проверка перед записью.

      <!-- ^главное-правило -->
      Механический конфликт сильнее решения ИИ. Если код видит жёсткое
      противоречие, ИИ не может молча разрешить его и продолжить запись.

      <!-- ^нет-конфликта -->
      Если жёсткого конфликта нет и ИИ уверенно подтверждает совпадение или
      новый заказ, запись допускается только после финальной проверки.

      <!-- ^результат -->
      При конфликте или слабой уверенности пользователь получает ошибку или
      короткий вопрос. Старые данные не перезаписываются молча.

  - id: механическая проверка конфликта
    body_markdown: |
      Кодовая проверка очевидных конфликтов. Она работает как валидация и не
      требует смыслового понимания текста.

      <!-- ^что-проверяет -->
      Проверяются только строгие факты:
      - тот же `order_number`, но другая итоговая сумма;
      - тот же `order_number`, но другой продавец;
      - тот же `item_number`, но другая сумма строки товара;
      - сумма компонентов не сходится с итогом;
      - валюта без USD-эквивалента;
      - не хватает обязательных полей;
      - один снимок механически подходит к нескольким заказам.

      <!-- ^результат -->
      Если найден жёсткий конфликт, чистовая запись запрещена. ИИ может только
      помочь сформулировать сообщение пользователю, но не может отменить
      результат этой проверки.

  - id: ИИ проверка совпадения
    body_markdown: |
      Смысловая сверка, где кодовой проверки недостаточно.

      <!-- ^что-проверяет -->
      ИИ проверяет:
      - один ли это заказ, если на части скриншотов нет номера заказа;
      - совпадает ли товар при обрезанном или немного иначе распознанном названии;
      - похож ли продавец, если OCR прочитал его с ошибкой;
      - не является ли отличие в доставке или трек-номере ошибкой распознавания;
      - достаточно ли совпадающих признаков, чтобы связать снимок с ровно одним заказом.

      <!-- ^кандидаты -->
      Кандидатов для смысловой сверки агент достаёт из базы через
      [[инструмент SQL]]. Для нечёткого совпадения по строкам (`sold_by`,
      `item_title`) используется расширение Postgres `pg_trgm`
      (https://www.postgresql.org/docs/current/pgtrgm.html) —
      `similarity(a, b)` возвращает число `0..1`, выше порога считается
      кандидатом для ИИ-проверки. Конкретные пороги — деталь реализации.

      <!-- ^ограничение -->
      ИИ не решает жёсткие конфликты из [[механическая проверка конфликта]].
      Если уверенности нет, запись не выполняется.

      <!-- ^результат -->
      Результат ИИ — одно из трёх решений:
      - совпадение подтверждено;
      - совпадение не подтверждено;
      - нужен вопрос пользователю.

  - id: финальная проверка перед сохранением
    body_markdown: |
      Последняя механическая проверка перед вызовом [[инструмент сохранения заказа]].

      <!-- ^что-проверяет -->
      Перед записью код ещё раз проверяет:
      - обязательные поля;
      - правила денег;
      - правила сумм;
      - отсутствие жёсткого конфликта с уже сохранёнными данными;
      - что пустые значения не затирают заполненные.

      <!-- ^результат -->
      Если финальная проверка не проходит, инструмент сохранения не вызывается.
      Пользователь получает ошибку или короткий вопрос.

  - id: чистовые таблицы
    body_markdown: |
      Чистовой слой хранит только данные страницы Order details.

      <!-- ^таблицы -->
      Таблицы:
      - `orders` — поля из [[поля идентификации заказа]], [[денежные поля заказа]]
        и [[поля доставки заказа]].
      - `order_items` — строки из [[поля товара]].
      - `order_refunds` — строки из [[поля возврата]].
      - `order_screenshot_links` — связь заказа с исходными снимками.
      - `order_change_log` — журнал изменений чистовых полей.

      <!-- ^нет-лишних-таблиц -->
      Отдельных таблиц для платежей, адресов, продавцов и типов страниц нет.
      Продавец хранится как `orders.sold_by`.

      <!-- ^удаление -->
      Удаление заказа — по явной просьбе пользователя через
      [[инструмент SQL]]. Удаляется заказ из `orders`, всё связанное
      (товары, возвраты, связки со скриншотами) уходит за ним
      автоматически. Никаких «удалён, но остался» полей — заказ либо
      есть, либо нет.

  - id: технические таблицы
    body_markdown: |
      Технический слой нужен для файлов, распознавания и чата.

      <!-- ^screenshots -->
      `screenshots`:
      - `sha256` файла;
      - размер и тип файла;
      - `ocr_status`;
      - `agent_status`;
      - текст последней ошибки, если стадия упала.

      Повторная загрузка того же файла не создаёт дубль.

      <!-- ^raw-ocr -->
      `raw_ocr`:
      - одна строка на `sha256`;
      - модель распознавания;
      - сырой JSON;
      - время распознавания.

      <!-- ^chat -->
      `chat_sessions` и `chat_messages` хранят историю переписки с
      агентом. Сообщение состоит из частей разного типа:
      - текст реплики;
      - прикреплённое фото (для произвольных фото в чате — единственное
        место, где они хранятся, отдельной таблицы под них нет);
      - запись действия агента — имя инструмента, запрос, ответ
        инструмента, итоговое состояние;
      - финальная пометка «прервано», если ответ был остановлен.

      Как именно эти части показаны пользователю — см.
      [[ответ пользователю#действия]]. Здесь описано только то, что
      физически лежит в базе.

      Сохранение сообщений и его момент — в [[Стадия B сборка заказа#persistence]].

      История чата чистится только по нажатию кнопки сброса
      ([[чат и сессия#reset]]). Авто-чистки по таймеру нет. Заказы и
      сырой OCR при сбросе чата не трогаются.

  - id: статусы обработки
    body_markdown: |
      <!-- ^значения -->
      Статусы стадий:
      - `pending` — ждёт обработки;
      - `running` — сейчас обрабатывается;
      - `done` — стадия завершилась успешно;
      - `failed` — стадия завершилась ошибкой.

      <!-- ^нет-непривязанного-успеха -->
      Неоднозначный снимок не считается успешным "непривязанным" исходом.
      Если его нельзя связать с заказом по [[правила группировки снимков]],
      стадия B завершает группу ошибкой.

      <!-- ^готовность-к-b -->
      Снимок готов к стадии B, когда OCR завершён, сырой JSON сохранён и
      `agent_status = pending`.

  - id: инструмент сохранения заказа
    body_markdown: |
      Удобный инструмент записи нового или обновлённого заказа со
      скриншотов.

      <!-- ^назначение -->
      Это основной путь для стадии B: «собрал заказ из одной или
      нескольких связанных снимков — сохрани целиком». Все рутинные
      вещи делает за агента сам инструмент: разбирает суммы из текста,
      проверяет валюту, привязывает снимки к заказу, отмечает их как
      обработанные.

      <!-- ^вход -->
      Что агент передаёт:

      ![[поля идентификации заказа#поля]]
      ![[денежные поля заказа#поля]]
      ![[поля доставки заказа#поля]]

      Список товаров:

      ![[поля товара#поля]]

      Список возвратов:

      ![[поля возврата#поля]]

      И служебно: какие снимки лежат в основе этого заказа и
      [[источник изменения]] (`screenshot` или `user_chat`). Снимки
      должны быть распознаны и ещё не привязаны к другому заказу.

      <!-- ^запись -->
      Инструмент пишет всё одной транзакцией: создаёт или обновляет
      заказ, добавляет товары, возвраты и трек-номера без дублей,
      привязывает снимки и помечает их обработанными. Журнал изменений
      пишется автоматически.

      <!-- ^ограничения -->
      Инструмент не принимает поля из [[поля которые не сохраняются]] —
      они физически не входят в его контракт. Пустые значения не
      затирают заполненные.

      Для всего, что выходит за рамки «целиком сохранить заказ»
      (точечная правка, удаление, нестандартный запрос, чтение журнала)
      используется [[инструмент SQL]].

  - id: инструмент SQL
    body_markdown: |
      Универсальный SQL-инструмент стадии B. Техническое имя: `sql`.

      <!-- ^назначение -->
      Через `sql` агент:
      - читает кандидатов и данные базы для [[механическая проверка конфликта]],
        [[ИИ проверка совпадения]], [[вопросы пользователя по данным]];
      - точечно правит поля по [[явные правки пользователя]];
      - удаляет ошибочно загруженные заказы по явной просьбе пользователя
        обычным `DELETE`. Soft-delete не используется.

      <!-- ^вход -->
      Один параметр — текст SQL. Можно читать и менять данные в наших
      таблицах ([[чистовые таблицы]] и [[технические таблицы]]).
      Структуру схемы менять нельзя, в системные каталоги Postgres
      лазить нельзя — на это инструмент отвечает ошибкой, не выполняя
      запрос.

      <!-- ^источник -->
      Каждое изменение помечается [[источник изменения]] — обычно
      `user_chat`, потому что инструмент дёргается из чата. Для
      сохранений по скриншотам используется
      [[инструмент сохранения заказа]] — у него источник `screenshot`
      выставляется автоматически.

      <!-- ^граница -->
      За корректностью данных следит сама база: правила сумм, проверки
      форматов, отсутствие лишних полей. Если SQL это нарушает,
      транзакция отменяется и пользователь видит понятную ошибку.

  - id: параллельность tool-вызовов
    body_markdown: |
      Когда модель за один шаг просит выполнить несколько действий
      сразу (например, сохранить десяток заказов), мы запускаем их
      параллельно, а не по очереди.

      <!-- ^зачем -->
      Подряд это занимает десятки секунд тишины между шагами модели —
      каждое сохранение само по себе быстрое, но их много. Параллельно
      это укладывается в несколько секунд, и пользователь видит,
      что работа идёт.

      <!-- ^одновременность -->
      Одновременно выполняется ограниченное число действий. Лимит
      выбран так, чтобы не упереться в количество свободных
      соединений с базой — это деталь реализации, не правило системы.

      <!-- ^порядок -->
      Действия стартуют в том порядке, в котором их попросила модель,
      но завершаются в произвольном — какое первое успело, такое и
      первое появится готовым в чате. Внешне для пользователя это
      «блоки сворачиваются по мере выполнения».

      <!-- ^при-обрыве -->
      Если ответ агента обрывается посреди такой пачки, ещё не
      завершившиеся действия отменяются — база сама откатывает их
      транзакции. То, что уже зафиксировано, остаётся в базе.

  - id: инструмент фиксации ошибки
    body_markdown: |
      Внутренняя операция бэкенда для явной ошибки обработки. Это не tool
      LLM — её вызывает код, когда стадия B сама признаёт группу неуспешной.

      <!-- ^действие -->
      Фиксирует:
      - какие `sha256` затронуты;
      - на каком шаге упала обработка;
      - короткую причину для пользователя;
      - техническую причину для журнала.

      Чистовые данные при такой ошибке не создаются и не обновляются.
      Ошибка одной группы заказа не отменяет сохранение других валидных групп
      из той же пачки.

  - id: чат и сессия
    body_markdown: |
      У приложения один экран — чат с моделью. Слева на всю высоту —
      галерея скриншотов заказов ([[сайдбар скриншотов заказов]]).
      Справа — лента сообщений и поле ввода.

      <!-- ^экран -->
      У пользователя есть два независимых места для фото:
      - дроп в [[сайдбар скриншотов заказов]] — это запускает только
        стадию A (транскрибацию). Сами заказы из этих снимков не
        собираются автоматически: для сборки пользователь явно пишет в
        чат («обработай», «собери эти снимки» и т. п.), и тогда стартует
        [[Стадия B сборка заказа]] (см. [[Стадия B сборка заказа#запуск]]);
      - прикрепление к сообщению в чате — это видит агент стадии B как
        обычное мультимодальное сообщение (см.
        [[Стадия B сборка заказа#контракт]]).

      Куда фото попадает — решается местом drop, никаких кнопок-режимов.

      <!-- ^session-id -->
      Сессия у системы одна и постоянная. Она не привязана к открытию
      страницы: одно устройство — один пользователь — одна сессия.
      Перезагрузка вкладки или переоткрытие чата не создают новую
      сессию.

      <!-- ^reset -->
      В шапке чата есть кнопка «Сбросить чат». Перед сбросом
      пользователь подтверждает действие. После подтверждения вся
      история переписки текущей сессии удаляется, чат становится пустым.
      Заказы, сырой OCR и сайдбар скриншотов при этом не трогаются —
      они живут в базе независимо от истории переписки. Если в момент
      сброса агент стримит ответ — стрим обрывается, его сообщение в
      историю не попадает.

      <!-- ^stop -->
      Пока агент стримит свой ответ, в чате видна кнопка «Стоп». По
      нажатию стрим обрывается. Уже накопленный кусок ответа
      сохраняется в чате как сообщение ассистента с пометкой
      «прервано» (см. [[Стадия B сборка заказа#persistence]]).
      Tool-вызовы, которые агент уже успел сделать (запись или удаление
      в базе), не откатываются — это уже состоявшиеся действия.

      То же самое происходит, если пользователь закрыл вкладку или
      потерял связь во время ответа: для системы это эквивалент Stop.

      <!-- ^concurrent-send -->
      Пока агент стримит ответ, кнопка «Отправить» в композере
      превращается в «Стоп». Отправить новое сообщение, пока агент
      не закончил или его не остановили, нельзя.

      <!-- ^технически -->
      Фронт — Next.js (https://nextjs.org/docs/app) + AI SDK v6
      (https://ai-sdk.dev/docs/ai-sdk-ui/chatbot). Ответ агента
      приходит из чат-эндпоинта потоком в формате [[стрим стадии B]] —
      сообщение собирается на фронте по мере поступления событий, без
      отдельных подписок поверх этого потока.

  - id: ответ пользователю
    body_markdown: |
      Что и как агент пишет пользователю в чат.

      Прогресс распознавания скриншотов виден только в сайдбаре
      ([[сайдбар скриншотов заказов#счётчики]]). В чате агент пишет
      только осмысленный итог или вопрос — короткой репликой ассистента.

      <!-- ^действия -->
      Действия агента (вызовы инструментов — посмотреть в базу,
      сохранить заказ, удалить заказ) видны прямо в чате как небольшие
      плашки внутри сообщения ассистента.

      Пока действие идёт, плашка раскрыта: пользователь видит, что
      именно агент сейчас делает — какой запрос ушёл и отметку
      «выполняется». Как только действие закончилось, плашка через
      короткую паузу автоматически сворачивается до одной строки с
      именем действия и его статусом («выполнено» или «ошибка»). Сама
      плашка из чата не пропадает — её всегда можно раскрыть обратно
      кликом и посмотреть, какой был запрос и какой пришёл ответ.

      Если у действия ошибка, плашка тоже сворачивается, но статус
      виден сразу — пользователь его не пропустит.

      <!-- ^сводка -->
      Когда агент закончил работу с пачкой, он пишет короткую сводку:
      сколько заказов создал, сколько обновил, какие группы не сохранил
      и почему.

      <!-- ^ошибка -->
      Ошибки не скрываются. Если действие агента не получилось — он
      пишет пользователю человеческое объяснение «не получилось
      сохранить заказ X, потому что ...». Сырые системные сообщения и
      технические детали в чат не уходят, но сама ошибка не маскируется.

      <!-- ^вопросы-агента -->
      Если агент не уверен (двусмысленная правка, неоднозначная группа
      снимков, конфликт с базой), он задаёт пользователю вопрос
      обычным сообщением. Никаких кнопок «да/нет» или предзаготовленных
      вариантов — пользователь отвечает свободным текстом, и агент
      продолжает с этого места.

      <!-- ^связь -->
      Если связь с сервером пропала во время ответа агента, ответ
      обрывается так же, как при нажатии «Стоп» (см. [[чат и сессия#stop]]):
      то, что успело прозвучать, остаётся в чате с пометкой «прервано».
      В шапке чата при этом появляется явная пометка «связь потеряна» —
      без авто-повторов запроса к агенту. Сама подписка на состояние
      сайдбара восстанавливается автоматически, когда соединение
      возвращается, — это бытовая защита от тихих обрывов фоновых
      каналов, а не повтор пользовательского сообщения.

  - id: стрим стадии B
    body_markdown: |
      Как ответ агента доходит до браузера.

      <!-- ^что-это -->
      Когда пользователь отправляет сообщение, бэкенд держит одно
      открытое HTTP-соединение — и пока агент думает и работает, в
      это соединение постепенно вливаются куски ответа: текстовые
      фрагменты, начало действия (вызов инструмента), результат
      действия, следующие текстовые фрагменты и так далее. Фронт
      читает поток по мере поступления и сразу дорисовывает чат.

      <!-- ^формат -->
      Формат потока — стандартный для AI SDK
      (https://ai-sdk.dev/docs/ai-sdk-ui/stream-protocol). Используем
      его без изменений: чанки с текстом, чанки про начало и конец
      каждого действия инструмента. Фронтовая обвязка `useChat`
      собирает их в одно сообщение ассистента сама.

      <!-- ^обрыв -->
      Если стрим оборвался — нажали «Стоп», закрыли вкладку, потеряли
      связь — бэкенд узнаёт об этом и аккуратно сворачивает работу:
      незавершённые действия отменяются, что успело сохраниться в
      чате — сохраняется (см. [[Стадия B сборка заказа#persistence]]).

  - id: вопросы пользователя по данным
    body_markdown: |
      Когда пользователь просто спрашивает про сохранённые заказы,
      агент только смотрит в базу и отвечает текстом — никаких записей.

      Если вопрос требует данных, которых система не хранит
      ([[поля которые не сохраняются]]), агент честно говорит, что
      таких данных у нас нет.

  - id: сайдбар скриншотов заказов
    body_markdown: |
      Постоянная панель слева на всю высоту страницы — все скриншоты
      заказов, которые когда-либо были загружены. Это окно на базу,
      а не на сессию чата: сброс чата сайдбар не очищает.

      <!-- ^счётчики -->
      Сверху сайдбара — сводка по всем скриншотам, по одному числу на
      каждый из статусов транскрибации (см. [[статусы обработки#значения]]).
      Цифры обновляются в реальном времени по мере того, как стадия A
      разбирает скриншоты.

      Тот же поток обновлений несёт цифры по стадии B — сколько снимков
      она уже собрала в заказы и сколько помечены ошибочными. Эти числа
      видны в шапке чата как [[прогресс стадии B]].

      <!-- ^карточки -->
      Под счётчиками — карточки самих скриншотов, недавние сверху. На
      карточке: маленькое превью, статус и, если стадия B уже привязала
      снимок к заказу, его номер.

      <!-- ^детали -->
      По клику на карточку открывается окно с подробностями про этот
      снимок:
      - увеличенное превью картинки;
      - текущий статус (по тем же значениям, что и в счётчиках);
      - если ошибка — её текст;
      - если готово — что именно прочитала модель по
        [[формат сырого распознавания]]: распознанные поля, список
        товаров и возвратов, заметки «вижу, но не смог разобрать»;
      - сколько времени заняла транскрибация;
      - номер заказа, если стадия B уже привязала снимок, — иначе
        пометка «пока не привязан»;
      - кнопка «Удалить» — на случай если файл закинули по ошибке.

      <!-- ^drop -->
      Когда пользователь перетаскивает в сайдбар файл или папку, файлы
      регистрируются и встают в очередь стадии A. Папка разворачивается
      сама, рекурсивно. Повторно перетащенный тот же файл не создаёт
      дубль.

      Лимита на количество файлов в одном дропе нет. На размер одного
      файла жёсткого ограничения тоже нет, но подозрительно большие
      картинки (заметно больше типичного скриншота, скажем больше
      10 МБ) бэкенд отклоняет с понятной ошибкой — это почти всегда
      значит, что положили не то.

      <!-- ^удаление-снимка -->
      Кнопка «Удалить» на карточке снимка убирает сам файл и всё, что
      он накопил по дороге: запись в `screenshots`, его сырой OCR,
      связку с заказом. Сам заказ при этом не удаляется — он
      самостоятельная сущность и может опираться на другие снимки.
      Перед удалением — подтверждение, как и у сброса чата.

      <!-- ^граница -->
      В сайдбар кладутся только скриншоты eBay Order details. Если
      пользователь по ошибке закинул что-то другое, стадия A пометит
      снимок как «не Order details» (см.
      [[поддерживаемая страница заказа#неподдержанные-страницы]]) и
      заказ создан не будет — карточка останется в сайдбаре со
      статусом «ошибка»,
      пользователь может попросить агента удалить её словами в чате.

  - id: прогресс стадии B
    body_markdown: |
      Маленький счётчик в шапке чата. Сообщает пользователю, что есть
      непривязанные снимки, и показывает прогресс агента, когда тот
      работает.

      <!-- ^видимость -->
      Счётчик виден только если есть, что показать:
      - есть распознанные снимки, ожидающие сборки в заказы — пишем
        «Новых снимков: P»;
      - агент сейчас стримит ответ — пишем «Обработано N из M,
        ошибок K».

      В обычном спокойном состоянии счётчик скрыт, шапка чата чистая.

      <!-- ^источник -->
      Источник чисел — тот же поток статусов, что питает сайдбар
      (см. [[сайдбар скриншотов заказов#счётчики]]). Считаются
      скриншоты: сколько успело пройти через стадию B хотя бы раз,
      сколько из них превратились в заказы, сколько помечены ошибочными.

      <!-- ^не-про-это -->
      Это не «состояние сессии агента». Сессия начинается и кончается
      внутри одного ответа — отдельной индикации сессии нет. Если
      агент молчит, в шапке либо пусто, либо «Новых снимков: P».

  - id: промпт стадии A
    body_markdown: |
      System-промпт для модели стадии A (распознавание одного снимка).

      Промпт **не повторяет** список полей и их типы — это есть в JSON-схеме,
      которая прикладывается к запросу через `response_format` (см.
      [[формат сырого распознавания#поля]]). Промпт описывает только
      поведенческие правила.

      <!-- ^правила -->
      Жёсткие правила, по которым промпт собирается:
      - один скриншот за вызов; ожидается eBay Order details;
      - не придумывать значения; если не видно — `null`, для пустых списков —
        `[]`;
      - сохранять денежные суммы и даты как сырой текст ровно как видно
        ([[базовые правила#без-угадывания]], [[формат сырого распознавания#деньги]]);
      - если страница явно не Order details — `is_order_details=false`,
        все поля `observed` — `null` или `[]`, `visible_text` всё равно
        полностью читаемый текст ([[поддерживаемая страница заказа#неподдержанные-страницы]]);
      - если фрагмент видно частично или нечитабельно — поле `null`, в
        `unreadable[]` короткая заметка о пиксельной причине;
      - ответ строго JSON по приложенной схеме, без комментариев вне JSON.

  - id: промпт стадии B
    body_markdown: |
      System-промпт для модели стадии B. Один промпт, без деления на
      ветки: агент сам решает по контексту сообщения, что делать.

      <!-- ^общие -->
      Общие правила:
      - инструменты — [[инструмент сохранения заказа]] и [[инструмент SQL]];
      - решения по полям и валюте — по [[базовые правила]],
        [[правила денег USD]], [[правила объединения полей]];
      - поведение в чате — по [[базовые правила#тихий-чат]];
      - не повторять перечень полей внутри промпта — структура задаётся
        JSON-схемой каждого инструмента.

      <!-- ^обстановка -->
      Из системного промпта агент видит, сколько сейчас распознанных
      снимков ожидают сборки (см. [[Стадия B сборка заказа#контракт]]).
      Это **число**, без подробностей по каждому снимку. Если для
      ответа нужны сами данные — sha и observed — агент поднимает их
      сам через [[инструмент SQL]] (`SELECT` из `screenshots`/`raw_ocr`).

      <!-- ^поведение -->
      На каждое сообщение пользователя агент выбирает действие сам:
      - вопрос по сохранённым заказам — читает базу через
        [[инструмент SQL]] и отвечает коротким текстом, ничего не пишет;
      - явная правка поля — точечно через [[инструмент SQL]] с источником
        `user_chat`, без перезаписи соседних полей ([[явные правки пользователя]]);
      - явная просьба удалить заказ — `DELETE` через [[инструмент SQL]]
        с источником `user_chat`;
      - явная просьба обработать pending-снимки — поднимает observed,
        группирует по [[правила группировки снимков]], сверяется с базой
        ([[правила конфликта с базой]]) и сохраняет через
        [[инструмент сохранения заказа]] (источник `screenshot`);
      - намерение неясно, спорная группа снимков, конфликт с базой,
        обращение к [[поля которые не сохраняются]] — короткий вопрос
        или отказ, никаких записей.

      Без явной просьбы пользователя стадия B ничего не пишет в
      чистовой слой — это базовое правило, оно сильнее любого
      «удобства» агента.

      Сброс истории чата агенту делать не нужно — это отдельная
      кнопка в UI ([[чат и сессия#reset]]).

      <!-- ^запреты -->
      - выдумывать значения, конвертировать валюту, переформатировать даты;
      - перезаписывать поля, которые пользователь явно не назвал в правке;
      - трогать pending-снимки без явной просьбы пользователя;
      - выходить за whitelist таблиц и операций ([[инструмент SQL#вход]]);
      - дублировать в промпте описания полей — оно живёт в JSON-схемах.

  - id: явные правки пользователя
    body_markdown: |
      Пользователь может явно исправить сохранённое поле словами.

      <!-- ^правило -->
      Правка применяется только если понятно:
      - какой заказ меняется;
      - какое поле меняется;
      - новое значение не нарушает [[правила денег USD]];
      - новое значение относится к списку [[чистые поля заказа]].

      <!-- ^ошибка -->
      Если правка двусмысленная или относится к несохраняемому полю, агент
      задаёт короткий вопрос или отказывает с причиной.

steps:
  - id: запуск-сервиса
    body_markdown: |
      Запустить локальный сервис и подготовить фоновые обработчики.

      ![[базовые правила#без-угадывания]]
    links:
      - to: открытие-страницы-чата
        condition: сервис готов

  - id: открытие-страницы-чата
    body_markdown: |
      Пользователь открывает единственную страницу чата.

      ![[чат и сессия#session-id]]
    links:
      - to: прием-сообщения
        condition: пользователь отправил текст или файлы

  - id: прием-сообщения
    body_markdown: |
      У пользователя есть два независимых источника событий
      ([[чат и сессия#экран]]):
      - дроп файлов или папок в [[сайдбар скриншотов заказов]];
      - сообщение в чате (с фото или без).

      Дроп идёт в стадию A. Сообщение в чате идёт в стадию B —
      агент сам решает что с ним делать (ответить текстом, посмотреть
      на прикреплённое фото, заглянуть в базу, сохранить или удалить
      что-то). Это два разных маршрута, между ними не нужно ничего
      переключать.
    links:
      - to: регистрация-снимков
        condition: дроп в сайдбар
      - to: обработка-сообщения
        condition: сообщение в чате

  - id: регистрация-снимков
    body_markdown: |
      Скриншоты, упавшие в сайдбар, регистрируются и встают в очередь
      распознавания.

      ![[сайдбар скриншотов заказов#drop]]
    links:
      - to: захват-снимка-для-ocr
        condition: есть новые снимки

  - id: захват-снимка-для-ocr
    body_markdown: |
      Фоновый обработчик берёт один снимок со статусом `ocr_status = pending`.

      ![[статусы обработки#значения]]
    links:
      - to: распознавание-снимка
        condition: снимок захвачен

  - id: распознавание-снимка
    body_markdown: |
      Выполнить стадию A для одного скриншота.

      ![[Стадия A распознавание одного снимка#контракт]]
    links:
      - to: сохранение-сырого-ocr
        condition: получен проверяемый JSON
      - to: ошибка-ocr
        condition: JSON не получен или не проверяется

  - id: сохранение-сырого-ocr
    body_markdown: |
      Сохранить сырой результат без бизнес-решений. Снимок остаётся со
      статусом «готов к стадии B» (см. [[статусы обработки#готовность-к-b]]).
      Сама стадия B сама по себе не запускается — она ждёт явной
      команды пользователя ([[Стадия B сборка заказа#запуск]]).

      ![[формат сырого распознавания#граница]]
      ![[технические таблицы#raw-ocr]]
    links:
      - to: отправка-прогресса
        condition: сырой JSON сохранён

  - id: ошибка-ocr
    body_markdown: |
      Зафиксировать ошибку распознавания одного снимка.

      ![[Стадия A распознавание одного снимка#ошибка]]
      ![[инструмент фиксации ошибки#действие]]
    links:
      - to: отправка-прогресса
        condition: ошибка записана

  - id: чтение-сырых-ocr
    body_markdown: |
      По явной просьбе пользователя стадия B поднимает сырой JSON по
      непривязанным снимкам (`agent_status='pending'`).

      ![[формат сырого распознавания#поля]]
    links:
      - to: проверка-поддержанной-страницы
        condition: сырой OCR прочитан

  - id: проверка-поддержанной-страницы
    body_markdown: |
      Проверить, что каждый снимок относится к странице Order details.

      ![[поддерживаемая страница заказа#признаки]]
    links:
      - to: группировка-снимков-в-заказы
        condition: снимки похожи на поддержанную страницу
      - to: ошибка-неподдержанной-страницы
        condition: есть неподдержанная или непонятная страница

  - id: группировка-снимков-в-заказы
    body_markdown: |
      Разложить снимки на группы заказов без опоры на порядок файлов.

      ![[правила группировки снимков#основа]]
      ![[правила группировки снимков#без-порядка-файлов]]
      ![[правила группировки снимков#без-номера-заказа]]
    links:
      - to: объединение-полей-заказа
        condition: каждый снимок связан с ровно одной группой
      - to: ошибка-группировки
        condition: связь снимка с заказом неясна

  - id: объединение-полей-заказа
    body_markdown: |
      Собрать один набор полей на каждую группу заказа.

      ![[правила объединения полей#поведение]]
      ![[правила объединения полей#нормализация]]
    links:
      - to: проверка-достаточности-данных
        condition: поля объединены без противоречий
      - to: ошибка-противоречия-внутри-группы
        condition: значения внутри группы противоречат друг другу

  - id: проверка-достаточности-данных
    body_markdown: |
      Проверить, что по заказу достаточно данных для чистовой записи.

      ![[правила достаточности данных#минимум-новый-заказ]]
      ![[правила достаточности данных#необязательные]]
    links:
      - to: проверка-денег
        condition: данных достаточно
      - to: ошибка-недостаточно-данных
        condition: данных меньше минимума

  - id: проверка-денег
    body_markdown: |
      Проверить, что для каждой сохраняемой суммы есть значение в USD.

      ![[правила денег USD#поддерживается]]
      ![[правила денег USD#точность]]
    links:
      - to: проверка-сумм
        condition: USD-суммы видны и читаются до цента
      - to: ошибка-валюты
        condition: другая валюта видна без USD-эквивалента

  - id: проверка-сумм
    body_markdown: |
      Проверить внутреннюю согласованность сумм заказа.

      ![[правила проверки сумм#формула]]
      ![[правила проверки сумм#строки-товаров]]
      ![[правила проверки сумм#возвраты]]
    links:
      - to: сверка-с-базой
        condition: суммы не противоречат друг другу
      - to: ошибка-противоречия-внутри-группы
        condition: суммы не сходятся

  - id: сверка-с-базой
    body_markdown: |
      Прочитать из базы сохранённые заказы, которые могут относиться к этой
      группе скриншотов.

      ![[инструмент SQL#назначение]]
      ![[правила конфликта с базой#слои]]
    links:
      - to: механическая-проверка-с-базой
        condition: кандидаты из базы прочитаны

  - id: механическая-проверка-с-базой
    body_markdown: |
      Проверить очевидные конфликты кодом.

      ![[механическая проверка конфликта#что-проверяет]]
      ![[механическая проверка конфликта#результат]]
    links:
      - to: ошибка-конфликта-с-базой
        condition: найден жёсткий механический конфликт
      - to: финальная-проверка-перед-сохранением
        condition: сохранённых кандидатов нет
      - to: ии-сверка-с-базой
        condition: жёсткого конфликта нет, но есть похожие кандидаты

  - id: ии-сверка-с-базой
    body_markdown: |
      Дать ИИ смыслово сравнить собранный заказ с похожими кандидатами.

      ![[ИИ проверка совпадения#что-проверяет]]
      ![[ИИ проверка совпадения#ограничение]]
    links:
      - to: финальная-проверка-перед-сохранением
        condition: ИИ уверенно подтвердил совпадение или новый заказ
      - to: ошибка-конфликта-с-базой
        condition: ИИ нашёл смысловой конфликт или не уверен

  - id: финальная-проверка-перед-сохранением
    body_markdown: |
      Перед записью ещё раз пропустить заказ через механическую проверку.

      ![[финальная проверка перед сохранением#что-проверяет]]
      ![[финальная проверка перед сохранением#результат]]
    links:
      - to: сохранение-заказа
        condition: финальная проверка прошла
      - to: ошибка-конфликта-с-базой
        condition: финальная проверка нашла конфликт

  - id: сохранение-заказа
    body_markdown: |
      Записать проверенный заказ в чистовой слой.

      ![[инструмент сохранения заказа#вход]]
      ![[инструмент сохранения заказа#запись]]
      ![[инструмент сохранения заказа#ограничения]]
    links:
      - to: завершение-группы-заказа
        condition: заказ создан, обновлён или не изменился

  - id: завершение-группы-заказа
    body_markdown: |
      Отметить группу заказа как обработанную.

      Связи со скриншотами уже записаны через [[инструмент сохранения заказа]].
    links:
      - to: отправка-прогресса
        condition: группа завершена

  - id: ошибка-неподдержанной-страницы
    body_markdown: |
      Завершить группу ошибкой: скриншот не является поддержанной страницей.

      ![[поддерживаемая страница заказа#неподдержанные-страницы]]
      ![[инструмент фиксации ошибки#действие]]
    links:
      - to: отправка-прогресса
        condition: ошибка записана

  - id: ошибка-группировки
    body_markdown: |
      Завершить группу ошибкой: снимок нельзя строго связать с одним заказом.

      ![[правила группировки снимков#неясно]]
      ![[статусы обработки#нет-непривязанного-успеха]]
    links:
      - to: отправка-прогресса
        condition: ошибка записана

  - id: ошибка-недостаточно-данных
    body_markdown: |
      Завершить группу ошибкой: после всех скриншотов заказа не хватает
      обязательных данных.

      ![[правила достаточности данных#ошибка]]
      ![[инструмент фиксации ошибки#действие]]
    links:
      - to: отправка-прогресса
        condition: ошибка записана

  - id: ошибка-валюты
    body_markdown: |
      Завершить группу ошибкой: видна другая валюта без суммы в USD.

      ![[правила денег USD#ошибка-валюты]]
      ![[инструмент фиксации ошибки#действие]]
    links:
      - to: отправка-прогресса
        condition: ошибка записана

  - id: ошибка-противоречия-внутри-группы
    body_markdown: |
      Завершить группу ошибкой: скриншоты одного заказа противоречат друг другу.

      ![[базовые правила#строгие-противоречия]]
      ![[правила проверки сумм#количество-товаров]]
    links:
      - to: отправка-прогресса
        condition: ошибка записана

  - id: ошибка-конфликта-с-базой
    body_markdown: |
      Остановить запись из-за конфликта с уже сохранённым заказом.

      ![[правила конфликта с базой#результат]]
    links:
      - to: отправка-прогресса
        condition: пользователь получит ошибку или короткий вопрос

  - id: отправка-прогресса
    body_markdown: |
      Обновить общие счётчики (стадия A и стадия B) — они обновляются
      сразу же, как только меняется статус снимка или его связь с
      заказом. Никакого отдельного цикла «слать прогресс»: один поток
      статусов работает всегда (см. [[сайдбар скриншотов заказов#счётчики]]).

      ![[сайдбар скриншотов заказов#счётчики]]
    links:
      - to: формирование-сводки
        condition: пользователь ждал сводку (агент сейчас отвечает в чате)

  - id: формирование-сводки
    body_markdown: |
      Сформировать короткий итог по пачке.

      ![[ответ пользователю#сводка]]
      ![[базовые правила#тихий-чат]]
    links:
      - to: отправка-и-сохранение-ответа
        condition: сводка готова

  - id: обработка-сообщения
    body_markdown: |
      Стадия B получает сообщение пользователя — текст и, если есть,
      прикреплённые фото. Из системного промпта агент знает только
      число распознанных снимков, ожидающих сборки
      (см. [[Стадия B сборка заказа#контракт]]); подробностей по ним —
      нет. Дальше агент сам решает по контексту: ответить текстом,
      посмотреть на фото, заглянуть в базу, дописать или удалить
      заказ, поднять данные и собрать заказы из непривязанных снимков.
      Без явной просьбы пользователя в чистовой слой ничего не пишется.
    links:
      - to: выбор-текстового-действия
        condition: сообщение передано стадии B

  - id: выбор-текстового-действия
    body_markdown: |
      Выбрать действие по тексту пользователя.

      ![[базовые правила#тихий-чат]]
    links:
      - to: ответ-на-вопрос-по-данным
        condition: пользователь спрашивает по сохранённым заказам
      - to: применение-явной-правки
        condition: пользователь явно исправляет поле
      - to: удаление-заказа
        condition: пользователь явно просит удалить заказ
      - to: чтение-сырых-ocr
        condition: пользователь явно попросил обработать непривязанные снимки
      - to: вопрос-или-ошибка-по-тексту
        condition: намерение или заказ неясны

  - id: ответ-на-вопрос-по-данным
    body_markdown: |
      Ответить по сохранённым данным без изменения базы.

      ![[вопросы пользователя по данным#поведение]]
      ![[вопросы пользователя по данным#граница]]
    links:
      - to: отправка-и-сохранение-ответа
        condition: ответ готов

  - id: применение-явной-правки
    body_markdown: |
      Применить только понятную явную правку пользователя.

      ![[явные правки пользователя#правило]]
      ![[инструмент сохранения заказа#ограничения]]

      Точечная правка одного поля идёт через [[инструмент SQL]] (`UPDATE` с
      `source='user_chat'`). Полная пересборка заказа — через
      [[инструмент сохранения заказа]] с `source='user_chat'`.
    links:
      - to: отправка-и-сохранение-ответа
        condition: правка применена
      - to: вопрос-или-ошибка-по-тексту
        condition: правка двусмысленная или запрещена

  - id: удаление-заказа
    body_markdown: |
      Удалить заказ по явной просьбе пользователя через
      [[инструмент SQL]]. Подробности — в [[чистовые таблицы#удаление]].
    links:
      - to: отправка-и-сохранение-ответа
        condition: заказ удалён

  - id: вопрос-или-ошибка-по-тексту
    body_markdown: |
      Сообщить, что текстовую задачу нельзя выполнить без уточнения.

      ![[явные правки пользователя#ошибка]]
    links:
      - to: отправка-и-сохранение-ответа
        condition: вопрос или отказ сформирован

  - id: отправка-и-сохранение-ответа
    body_markdown: |
      Завершить ответ агента: дослать пользователю последний кусок
      текста и сохранить сообщение ассистента в историю —
      одной записью, со всеми его частями (см.
      [[Стадия B сборка заказа#persistence]]).

      ![[ответ пользователю#ошибка]]
